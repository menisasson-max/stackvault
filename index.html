<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StackVault</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M12 2C9.243 2 7 4.243 7 7v3H6c-1.103 0-2 .897-2 2v8c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-8c0-1.103-.897-2-2-2h-1V7c0-2.757-2.243-5-5-5zm-3 5c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm8 13H5v-8h14v8z'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <style>
    :root { color-scheme: light dark; }
    body { @apply bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-200; }
    .btn { @apply px-3 py-1.5 rounded-md font-medium text-sm transition-colors; }
    .btn-primary { @apply bg-indigo-600 hover:bg-indigo-700 text-white; }
    .btn-secondary { @apply bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700; }
    .input { @apply w-full px-3 py-2 bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-md focus:ring-2 focus:ring-indigo-500 outline-none; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden font-sans">
  
  <!-- Header -->
  <header class="flex items-center justify-between px-4 py-3 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 z-10">
    <div class="flex items-center gap-3">
      <div class="text-emerald-500">
        <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C9.243 2 7 4.243 7 7v3H6c-1.103 0-2 .897-2 2v8c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-8c0-1.103-.897-2-2-2h-1V7c0-2.757-2.243-5-5-5zm-3 5c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm8 13H5v-8h14v8z"/></svg>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-none">StackVault</h1>
        <span class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold">Zero-Knowledge Token Tracker</span>
      </div>
    </div>
    
    <div class="flex items-center gap-3">
      <div id="gSignInBtn" class="h-10"></div>
      <button onclick="window.app.toggleTheme()" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800">☀️/🌙</button>
      <button onclick="window.app.openProjectModal()" class="btn btn-primary">+ New Project</button>
    </div>
  </header>

  <!-- Main Layout -->
  <div class="flex flex-1 overflow-hidden">
    <!-- Sidebar -->
    <aside class="w-64 border-r border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 flex flex-col">
      <div class="p-4 border-b border-slate-200 dark:border-slate-800">
        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Projects</h2>
        <ul id="projectList" class="space-y-1"></ul>
      </div>
    </aside>

    <!-- Content -->
    <main class="flex-1 overflow-y-auto p-6 bg-white dark:bg-slate-950" id="mainContent">
      <div class="max-w-3xl mx-auto text-center mt-20" id="welcomeScreen">
        <h2 class="text-2xl font-bold mb-4">Welcome to StackVault</h2>
        <p class="text-slate-500 mb-6">Your encrypted, local-first stack and token manager.</p>
        <button onclick="window.app.initOnboarding()" class="btn btn-primary text-lg px-6 py-3">🪄 Start Setup Wizard</button>
      </div>
    </main>
  </div>

  <!-- Setup Wizard Modal -->
  <div id="modalOverlay" class="fixed inset-0 bg-black/60 hidden items-center justify-center z-50">
    <div class="bg-white dark:bg-slate-900 rounded-xl shadow-2xl w-full max-w-lg overflow-hidden border border-slate-200 dark:border-slate-700">
      <div class="p-4 border-b border-slate-200 dark:border-slate-800 flex justify-between items-center">
        <h3 id="modalTitle" class="font-bold">Setup Wizard</h3>
        <button onclick="window.app.closeModal()" class="text-slate-400 hover:text-white">&times;</button>
      </div>
      <div id="modalBody" class="p-6"></div>
    </div>
  </div>

  <script>
    const app = {
      // Your Hardcoded Client ID
      CLIENT_ID: "960610723494-m518prusem5tfqkg9n3rh5s9guo5u018.apps.googleusercontent.com",
      
      state: {
        theme: localStorage.getItem('sv_theme') || 'dark',
        user: null,
        projects: JSON.parse(localStorage.getItem('sv_projects')) || []
      },

      init() {
        this.applyTheme();
        this.renderProjects();
        this.initGoogleIdentityBtn();
      },

      applyTheme() {
        document.documentElement.className = this.state.theme;
        localStorage.setItem('sv_theme', this.state.theme);
      },

      toggleTheme() {
        this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
        this.applyTheme();
      },

      initGoogleIdentityBtn() {
        if (!window.google) return setTimeout(() => this.initGoogleIdentityBtn(), 100);
        google.accounts.id.initialize({
          client_id: this.CLIENT_ID,
          callback: this.handleCredentialResponse.bind(this)
        });
        google.accounts.id.renderButton(
          document.getElementById("gSignInBtn"),
          { theme: this.state.theme === 'dark' ? "filled_black" : "outline", size: "medium" }
        );
      },

      handleCredentialResponse(response) {
        const payload = JSON.parse(atob(response.credential.split('.')[1]));
        this.state.user = { email: payload.email, name: payload.name };
        document.getElementById("gSignInBtn").innerHTML = `<div class="px-3 py-1.5 bg-slate-800 rounded-md text-sm text-emerald-400 flex items-center gap-2">✓ ${payload.email}</div>`;
      },

      renderProjects() {
        const list = document.getElementById('projectList');
        if (this.state.projects.length === 0) {
          list.innerHTML = `<li class="text-sm text-slate-500 py-2">No projects yet.</li>`;
          return;
        }
        list.innerHTML = this.state.projects.map(p => `
          <li>
            <button class="w-full text-left px-3 py-2 rounded-md hover:bg-slate-200 dark:hover:bg-slate-800 text-sm font-medium transition-colors">
              ${p.name}
            </button>
          </li>
        `).join('');
      },

      openProjectModal() {
        this.openModal("Create New Project", `
          <div class="space-y-4">
            <div>
              <label class="block text-sm font-medium mb-1">Project Name</label>
              <input type="text" id="newProjectName" class="input" placeholder="e.g. SaaS Web Platform">
            </div>
            <div class="flex justify-end gap-2 pt-4">
              <button onclick="window.app.closeModal()" class="btn btn-secondary">Cancel</button>
              <button onclick="window.app.saveProject()" class="btn btn-primary">Save Project</button>
            </div>
          </div>
        `);
      },

      saveProject() {
        const name = document.getElementById('newProjectName').value.trim();
        if (!name) return;
        this.state.projects.push({ id: Date.now().toString(), name, tools: [] });
        localStorage.setItem('sv_projects', JSON.stringify(this.state.projects));
        this.renderProjects();
        this.closeModal();
      },

      initOnboarding() {
        this.openModal("Step 1: Google Account & Drive", `
          <div class="space-y-4 text-sm text-slate-300">
            <p>Your app is already configured with your OAuth Client ID.</p>
            <p>Please use the <strong>Sign In</strong> button in the top right header to connect your account and establish a zero-knowledge connection to your Google Drive.</p>
            <div class="flex justify-end pt-4">
              <button onclick="window.app.closeModal()" class="btn btn-primary">Got it</button>
            </div>
          </div>
        `);
      },

      openModal(title, html) {
        document.getElementById('modalTitle').innerText = title;
        document.getElementById('modalBody').innerHTML = html;
        document.getElementById('modalOverlay').classList.replace('hidden', 'flex');
      },

      closeModal() {
        document.getElementById('modalOverlay').classList.replace('flex', 'hidden');
      }
    };

    window.app = app;
    document.addEventListener('DOMContentLoaded', () => app.init());
  </script>
</body>
</html>
