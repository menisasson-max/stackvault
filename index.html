<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StackVault - Token Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2310b981'><path d='M12 2C9.243 2 7 4.243 7 7v3H6c-1.103 0-2 .897-2 2v8c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-8c0-1.103-.897-2-2-2h-1V7c0-2.757-2.243-5-5-5zm-3 5c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm8 13H5v-8h14v8z'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
    };
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    :root { color-scheme: light dark; }
    body { @apply bg-slate-50 text-slate-900 dark:bg-slate-950 dark:text-slate-100 antialiased transition-colors duration-200; }
    
    /* Buttons */
    .btn { @apply inline-flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium rounded-lg transition-all focus:outline-none focus:ring-2 focus:ring-offset-1 dark:focus:ring-offset-slate-900; }
    .btn-primary { @apply bg-indigo-600 text-white hover:bg-indigo-700 shadow-sm focus:ring-indigo-500; }
    .btn-secondary { @apply bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-300 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700 shadow-sm focus:ring-slate-500; }
    .btn-ghost { @apply text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 hover:text-slate-900 dark:hover:text-slate-100; }
    
    /* Inputs */
    .input-field { @apply w-full px-3.5 py-2.5 text-sm bg-white dark:bg-slate-950 border border-slate-300 dark:border-slate-700 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 placeholder-slate-400 dark:placeholder-slate-500 transition-shadow; }
    .code-input { @apply font-mono text-sm tracking-tight; }
    
    /* Cards & Layout */
    .card { @apply bg-white dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-800 shadow-sm p-6; }
    .tab-btn { @apply px-4 py-2 text-sm font-medium rounded-lg transition-all whitespace-nowrap; }
    .tab-active { @apply bg-indigo-50 dark:bg-indigo-500/10 text-indigo-700 dark:text-indigo-400; }
    .tab-inactive { @apply text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-slate-200; }
  </style>
</head>
<body class="flex flex-col h-screen overflow-hidden">

  <!-- TOP HEADER -->
  <header class="flex items-center justify-between px-6 py-3 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-950 z-20">
    <div class="flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-emerald-400 flex items-center justify-center text-white shadow-md">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C9.243 2 7 4.243 7 7v3H6c-1.103 0-2 .897-2 2v8c0 1.103.897 2 2 2h12c1.103 0 2-.897 2-2v-8c0-1.103-.897-2-2-2h-1V7c0-2.757-2.243-5-5-5zm-3 5c0-1.654 1.346-3 3-3s3 1.346 3 3v3H9V7zm8 13H5v-8h14v8z"/></svg>
      </div>
      <div>
        <h1 class="font-bold text-lg text-slate-900 dark:text-white leading-tight">StackVault</h1>
        <p class="text-[11px] font-medium text-slate-500 uppercase tracking-widest">Token Tracker</p>
      </div>
    </div>

    <div class="flex flex-1 max-w-md mx-8 relative hidden md:block">
      <input type="text" id="globalSearch" placeholder="Search projects or tools..." class="w-full pl-10 pr-4 py-2 bg-slate-100 dark:bg-slate-900 border-none rounded-full text-sm focus:ring-2 focus:ring-indigo-500 dark:text-slate-200">
      <svg class="w-4 h-4 absolute left-3.5 top-2.5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
    </div>

    <div class="flex items-center gap-3">
      <div id="gSignInBtn" class="h-10 hidden sm:block"></div>
      <button onclick="window.app.toggleTheme()" class="btn btn-ghost px-2.5" title="Toggle Theme">
        <span id="themeIcon" class="text-lg">🌙</span>
      </button>
      <button onclick="window.app.openBackupModal()" class="btn btn-secondary px-3" title="Backups">
        <span class="text-lg">💾</span>
      </button>
      <button onclick="window.app.openProjectModal()" class="btn btn-primary">
        + New Project
      </button>
    </div>
  </header>

  <!-- NAVIGATION TABS -->
  <div class="flex items-center px-4 py-2.5 border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/50 overflow-x-auto">
    <div class="flex items-center gap-2">
      <button onclick="window.app.switchView('matrix')" id="tab-matrix" class="tab-btn tab-inactive flex items-center gap-2">
        <span>📊</span> Matrix
      </button>
      <button onclick="window.app.switchView('accounts')" id="tab-accounts" class="tab-btn tab-inactive flex items-center gap-2">
        <span>👤</span> Accounts
      </button>
      <div class="w-px h-6 bg-slate-200 dark:bg-slate-700 mx-2"></div>
      <div id="projectTabsList" class="flex items-center gap-2"></div>
    </div>
  </div>

  <!-- MAIN WORKSPACE -->
  <div class="flex flex-1 overflow-hidden relative">
    <!-- Sidebar -->
    <aside id="toolSidebar" class="w-72 border-r border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-950 flex flex-col z-10">
      <div class="p-4 flex justify-between items-center border-b border-slate-200 dark:border-slate-800">
        <h2 class="text-xs font-bold text-slate-500 uppercase tracking-wider">Tools</h2>
        <button onclick="window.app.openAddToolModal()" class="text-indigo-600 dark:text-indigo-400 hover:underline text-sm font-medium">+ Add</button>
      </div>
      <div id="sidebarToolList" class="flex-1 overflow-y-auto p-3 space-y-2"></div>
      <div class="p-4 border-t border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900">
        <button onclick="window.app.exportProjectDotEnv()" class="w-full btn btn-secondary justify-center text-sm">
          📋 Copy All .env
        </button>
      </div>
    </aside>

    <!-- Content Pane -->
    <main class="flex-1 overflow-y-auto p-8 bg-slate-100 dark:bg-slate-950/50" id="mainWorkspacePane">
      <!-- Dynamic Content Renders Here -->
    </main>
  </div>

  <!-- MODALS -->
  <div id="modalOverlay" class="fixed inset-0 bg-slate-900/50 dark:bg-black/70 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
    <div class="bg-white dark:bg-slate-900 rounded-2xl shadow-xl w-full max-w-lg overflow-hidden border border-slate-200 dark:border-slate-800 flex flex-col max-h-[90vh]">
      <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex justify-between items-center bg-slate-50/50 dark:bg-slate-900">
        <h3 id="modalTitle" class="font-bold text-lg text-slate-900 dark:text-white">Title</h3>
        <button onclick="window.app.closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div id="modalBody" class="p-6 overflow-y-auto"></div>
    </div>
  </div>

  <script>
    window.app = {
      // Your Hardcoded Client ID
      CLIENT_ID: "960610723494-m518prusem5tfqkg9n3rh5s9guo5u018.apps.googleusercontent.com",
      
      state: {
        theme: localStorage.getItem('sv_theme') || 'dark',
        masterKey: localStorage.getItem('sv_master_key') || 'default-key',
        activeView: 'project',
        activeProjectId: null,
        activeToolId: null,
        data: null
      },

      defaultInitialData: {
        projects: [
          {
            id: 'proj_snappy',
            name: 'Snappy App',
            description: 'Mobile tennis stringing app',
            tools: [
              {
                id: 'tool_firebase', name: 'Firebase', category: 'Backend', tier: 'Prod',
                account: 'menisasson@gmail.com', resourceId: 'snappy-prod', consoleUrl: 'https://console.firebase.google.com',
                fields: [{ id: 'f1', label: 'FIREBASE_API_KEY', type: 'secret', value: 'AIzaSyDemoFakeKey' }]
              }
            ]
          }
        ]
      },

      init() {
        this.applyTheme();
        this.loadLocalData();
        if (!this.state.activeProjectId && this.state.data.projects.length > 0) {
          this.state.activeProjectId = this.state.data.projects[0].id;
        }
        this.renderAll();
        this.initGoogleIdentityBtn();
      },

      loadLocalData() {
        const stored = localStorage.getItem('sv_database');
        this.state.data = stored ? JSON.parse(stored) : this.defaultInitialData;
        if (!stored) this.saveLocalData();
      },

      saveLocalData() {
        localStorage.setItem('sv_database', JSON.stringify(this.state.data));
      },

      applyTheme() {
        document.documentElement.className = this.state.theme;
        localStorage.setItem('sv_theme', this.state.theme);
        const icon = document.getElementById('themeIcon');
        if (icon) icon.innerText = this.state.theme === 'dark' ? '☀️' : '🌙';
      },

      toggleTheme() {
        this.state.theme = this.state.theme === 'dark' ? 'light' : 'dark';
        this.applyTheme();
      },

      initGoogleIdentityBtn() {
        if (!window.google) return setTimeout(() => this.initGoogleIdentityBtn(), 150);
        google.accounts.id.initialize({ client_id: this.CLIENT_ID, callback: () => {} });
        google.accounts.id.renderButton(document.getElementById("gSignInBtn"), { theme: this.state.theme === 'dark' ? "filled_black" : "outline", size: "large", shape: "rectangular" });
      },

      renderAll() {
        this.renderTabs();
        if (this.state.activeView === 'matrix') this.renderMatrixView();
        else if (this.state.activeView === 'accounts') this.renderAccountsView();
        else this.renderProjectView();
      },

      renderTabs() {
        document.getElementById('tab-matrix').className = `tab-btn ${this.state.activeView === 'matrix' ? 'tab-active' : 'tab-inactive'} flex items-center gap-2`;
        document.getElementById('tab-accounts').className = `tab-btn ${this.state.activeView === 'accounts' ? 'tab-active' : 'tab-inactive'} flex items-center gap-2`;

        document.getElementById('projectTabsList').innerHTML = this.state.data.projects.map(p => `
          <button onclick="window.app.selectProject('${p.id}')" class="tab-btn ${this.state.activeView === 'project' && this.state.activeProjectId === p.id ? 'tab-active' : 'tab-inactive'} flex items-center gap-2">
            ${p.name}
            <span class="px-2 py-0.5 rounded-full text-xs font-semibold ${this.state.activeView === 'project' && this.state.activeProjectId === p.id ? 'bg-indigo-200 dark:bg-indigo-500/30' : 'bg-slate-200 dark:bg-slate-800'}">${p.tools.length}</span>
          </button>
        `).join('');
      },

      switchView(view) {
        this.state.activeView = view;
        this.renderAll();
      },

      selectProject(projId) {
        this.state.activeView = 'project';
        this.state.activeProjectId = projId;
        const p = this.state.data.projects.find(x => x.id === projId);
        this.state.activeToolId = p && p.tools.length > 0 ? p.tools[0].id : null;
        this.renderAll();
      },

      renderProjectView() {
        document.getElementById('toolSidebar').classList.remove('hidden');
        const project = this.state.data.projects.find(p => p.id === this.state.activeProjectId);
        if (!project) return;

        const sidebar = document.getElementById('sidebarToolList');
        sidebar.innerHTML = project.tools.map(t => `
          <button onclick="window.app.selectTool('${t.id}')" class="w-full text-left p-3 rounded-lg border transition-all ${t.id === this.state.activeToolId ? 'bg-white dark:bg-slate-900 border-indigo-500 dark:border-indigo-500 shadow-sm' : 'border-transparent hover:bg-slate-200/50 dark:hover:bg-slate-900'}">
            <div class="flex justify-between items-center mb-1">
              <span class="font-semibold text-slate-900 dark:text-slate-100">${t.name}</span>
              <span class="text-[10px] px-1.5 py-0.5 rounded font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400">${t.tier || 'Prod'}</span>
            </div>
            <div class="text-xs text-slate-500 truncate">${t.account || 'No account'}</div>
          </button>
        `).join('') || `<p class="text-sm text-slate-500 p-2">No tools added.</p>`;

        const pane = document.getElementById('mainWorkspacePane');
        const tool = project.tools.find(t => t.id === this.state.activeToolId);
        if (!tool) {
          pane.innerHTML = `<div class="text-center mt-20"><h3 class="text-xl font-bold mb-4">No Tools Yet</h3><button onclick="window.app.openAddToolModal()" class="btn btn-primary">+ Add First Tool</button></div>`;
          return;
        }

        pane.innerHTML = `
          <div class="max-w-4xl mx-auto space-y-8 pb-12">
            
            <div class="flex items-center justify-between">
              <div>
                <h2 class="text-3xl font-bold text-slate-900 dark:text-white mb-2">${tool.name}</h2>
                <div class="flex items-center gap-3 text-sm text-slate-600 dark:text-slate-400">
                  <span class="px-2 py-1 rounded-md bg-slate-200 dark:bg-slate-800 font-medium">${tool.tier || 'Prod'}</span>
                  <span>Category: ${tool.category || 'General'}</span>
                </div>
              </div>
              <div class="flex gap-3">
                ${tool.consoleUrl ? `<a href="${tool.consoleUrl}" target="_blank" class="btn btn-secondary">Open Console ↗</a>` : ''}
                <button onclick="window.app.deleteTool('${tool.id}')" class="btn btn-ghost text-red-600 hover:text-red-700 hover:bg-red-50 dark:hover:bg-red-500/10">Delete Tool</button>
              </div>
            </div>

            <!-- Identity Card -->
            <div class="card space-y-6">
              <h3 class="text-lg font-semibold text-slate-900 dark:text-white border-b border-slate-100 dark:border-slate-800 pb-4">Account & Identity</h3>
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                  <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Account / Email Used</label>
                  <input type="text" value="${tool.account || ''}" onchange="window.app.updateToolField('${tool.id}', 'account', this.value)" class="input-field">
                </div>
                <div>
                  <label class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-2">Project / Resource ID</label>
                  <input type="text" value="${tool.resourceId || ''}" onchange="window.app.updateToolField('${tool.id}', 'resourceId', this.value)" class="input-field code-input">
                </div>
              </div>
            </div>

            <!-- Secrets Card -->
            <div class="card space-y-6">
              <div class="flex justify-between items-center border-b border-slate-100 dark:border-slate-800 pb-4">
                <h3 class="text-lg font-semibold text-slate-900 dark:text-white">Environment Variables</h3>
                <div class="flex gap-2">
                  <button onclick="window.app.openBulkEnvModal('${tool.id}')" class="btn btn-secondary text-sm">📥 Bulk .env</button>
                  <button onclick="window.app.openAddFieldModal('${tool.id}')" class="btn btn-primary text-sm">+ Add Key</button>
                </div>
              </div>
              
              <div class="space-y-4">
                ${(tool.fields || []).map((f, idx) => `
                  <div class="flex flex-col sm:flex-row sm:items-center gap-4 p-4 rounded-xl border border-slate-200 dark:border-slate-800 bg-slate-50/50 dark:bg-slate-900/50">
                    <div class="sm:w-1/3">
                      <label class="block font-mono text-sm font-semibold text-slate-900 dark:text-slate-200 mb-1 break-all">${f.label}</label>
                      <span class="inline-block px-2 py-0.5 rounded text-[11px] font-medium uppercase tracking-wider bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-400">${f.type}</span>
                    </div>
                    <div class="flex-1 flex gap-2 items-center">
                      <div class="relative flex-1">
                        <input type="${f.type === 'secret' ? 'password' : 'text'}" id="val_${f.id}" value="${f.value || ''}" onchange="window.app.updateSecretVal('${tool.id}',${idx}, this.value)" class="input-field code-input pr-10">
                        ${f.type === 'secret' ? `
                          <button onclick="window.app.toggleVis('val_${f.id}')" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                          </button>
                        ` : ''}
                      </div>
                      <button onclick="navigator.clipboard.writeText('${f.value || ''}')" class="btn btn-secondary px-3 py-2.5" title="Copy">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"/></svg>
                      </button>
                      <button onclick="window.app.deleteField('${tool.id}',${idx})" class="p-2 text-slate-400 hover:text-red-500 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                      </button>
                    </div>
                  </div>
                `).join('') || `<p class="text-sm text-slate-500 py-4 text-center">No keys or secrets added yet.</p>`}
              </div>
            </div>
          </div>
        `;
      },

      selectTool(toolId) { this.state.activeToolId = toolId; this.renderAll(); },
      toggleVis(id) { const el = document.getElementById(id); if(el) el.type = el.type === 'password' ? 'text' : 'password'; },
      
      updateToolField(tid, fld, val) {
        const p = this.state.data.projects.find(x => x.id === this.state.activeProjectId);
        p.tools.find(t => t.id === tid)[fld] = val; this.saveLocalData();
      },
      updateSecretVal(tid, idx, val) {
        const p = this.state.data.projects.find(x => x.id === this.state.activeProjectId);
        p.tools.find(t => t.id === tid).fields[idx].value = val; this.saveLocalData();
      },
      deleteField(tid, idx) {
        const p = this.state.data.projects.find(x => x.id === this.state.activeProjectId);
        p.tools.find(t => t.id === tid).fields.splice(idx, 1); this.saveLocalData(); this.renderAll();
      },
      deleteTool(tid) {
        if(!confirm("Delete tool?")) return;
        const p = this.state.data.projects.find(x => x.id === this.state.activeProjectId);
        p.tools = p.tools.filter(t => t.id !== tid);
        this.state.activeToolId = p.tools.length ? p.tools[0].id : null;
        this.saveLocalData(); this.renderAll();
      },

      renderMatrixView() {
        document.getElementById('toolSidebar').classList.add('hidden');
        document.getElementById('mainWorkspacePane').innerHTML = `
          <div class="max-w-6xl mx-auto space-y-6">
            <div>
              <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Cross-Project Matrix</h2>
              <p class="text-slate-500">Bird's-eye view of every service across your stack.</p>
            </div>
            <div class="card overflow-x-auto p-0">
              <table class="w-full text-left border-collapse">
                <thead class="bg-slate-50 dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800">
                  <tr class="text-xs uppercase tracking-wider text-slate-500 font-semibold">
                    <th class="p-4">Project</th>
                    <th class="p-4">Tool</th>
                    <th class="p-4">Account</th>
                    <th class="p-4">Keys</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 dark:divide-slate-800">
                  ${this.state.data.projects.flatMap(p => p.tools.map(t => `
                    <tr class="hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors">
                      <td class="p-4 font-semibold text-slate-900 dark:text-slate-100">${p.name}</td>
                      <td class="p-4 font-medium text-indigo-600 dark:text-indigo-400">${t.name}</td>
                      <td class="p-4 text-sm text-slate-600 dark:text-slate-400">${t.account || '—'}</td>
                      <td class="p-4 text-sm text-slate-600 dark:text-slate-400">${(t.fields||[]).length} saved</td>
                    </tr>
                  `)).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      },

      renderAccountsView() {
        document.getElementById('toolSidebar').classList.add('hidden');
        const accs = {};
        this.state.data.projects.forEach(p => p.tools.forEach(t => {
          const a = t.account || 'Unassigned';
          if(!accs[a]) accs[a] = [];
          accs[a].push({ p: p.name, t: t.name });
        }));

        document.getElementById('mainWorkspacePane').innerHTML = `
          <div class="max-w-5xl mx-auto space-y-6">
            <div>
              <h2 class="text-2xl font-bold text-slate-900 dark:text-white mb-2">Accounts Directory</h2>
              <p class="text-slate-500">Grouped by registration email.</p>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
              ${Object.entries(accs).map(([a, items]) => `
                <div class="card space-y-4">
                  <div class="flex items-center gap-3 border-b border-slate-100 dark:border-slate-800 pb-3">
                    <div class="w-8 h-8 rounded-full bg-indigo-100 dark:bg-indigo-500/20 flex items-center justify-center text-indigo-600 dark:text-indigo-400 font-bold">${a.charAt(0).toUpperCase()}</div>
                    <h3 class="font-bold text-lg text-slate-900 dark:text-white">${a}</h3>
                  </div>
                  <ul class="space-y-2">
                    ${items.map(i => `
                      <li class="flex justify-between items-center p-3 rounded-lg bg-slate-50 dark:bg-slate-900/50 border border-slate-100 dark:border-slate-800">
                        <span class="font-semibold text-slate-800 dark:text-slate-200">${i.t}</span>
                        <span class="text-sm text-slate-500">${i.p}</span>
                      </li>
                    `).join('')}
                  </ul>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      },

      openProjectModal() {
        this.openModal("Create Project", `
          <div class="space-y-5">
            <div><label class="block text-sm font-medium mb-2">Project Name</label><input type="text" id="nProj" class="input-field"></div>
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-800">
              <button onclick="window.app.closeModal()" class="btn btn-secondary">Cancel</button>
              <button onclick="window.app.saveProject()" class="btn btn-primary">Create</button>
            </div>
          </div>
        `);
      },
      saveProject() {
        const name = document.getElementById('nProj').value.trim();
        if(!name) return;
        const id = 'p_' + Date.now();
        this.state.data.projects.push({ id, name, tools: [] });
        this.saveLocalData(); this.selectProject(id); this.closeModal();
      },

      openAddToolModal() {
        this.openModal("Add Tool", `
          <div class="space-y-5">
            <div><label class="block text-sm font-medium mb-2">Tool Name (e.g. Vercel)</label><input type="text" id="nTool" class="input-field"></div>
            <div class="grid grid-cols-2 gap-4">
              <div><label class="block text-sm font-medium mb-2">Tier</label><select id="nTier" class="input-field"><option>Prod</option><option>Dev</option></select></div>
              <div><label class="block text-sm font-medium mb-2">Account</label><input type="text" id="nAcc" value="menisasson@gmail.com" class="input-field"></div>
            </div>
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-800">
              <button onclick="window.app.closeModal()" class="btn btn-secondary">Cancel</button>
              <button onclick="window.app.saveTool()" class="btn btn-primary">Add</button>
            </div>
          </div>
        `);
      },
      saveTool() {
        const name = document.getElementById('nTool').value.trim();
        if(!name) return;
        const t = { id: 't_'+Date.now(), name, tier: document.getElementById('nTier').value, account: document.getElementById('nAcc').value, fields: [] };
        this.state.data.projects.find(p => p.id === this.state.activeProjectId).tools.push(t);
        this.state.activeToolId = t.id; this.saveLocalData(); this.renderAll(); this.closeModal();
      },

      openAddFieldModal(tid) {
        this.openModal("Add Key", `
          <div class="space-y-5">
            <div><label class="block text-sm font-medium mb-2">Key Name (e.g. API_KEY)</label><input type="text" id="nKey" class="input-field code-input"></div>
            <div><label class="block text-sm font-medium mb-2">Type</label><select id="nType" class="input-field"><option value="secret">Secret / Password</option><option value="text">Plain Text</option></select></div>
            <div><label class="block text-sm font-medium mb-2">Value</label><input type="text" id="nVal" class="input-field code-input"></div>
            <div class="flex justify-end gap-3 pt-4 border-t border-slate-200 dark:border-slate-800">
              <button onclick="window.app.closeModal()" class="btn btn-secondary">Cancel</button>
              <button onclick="window.app.saveField('${tid}')" class="btn btn-primary">Save Key</button>
            </div>
          </div>
        `);
      },
      saveField(tid) {
        const label = document.getElementById('nKey').value.trim();
        if(!label) return;
        const p = this.state.data.projects.find(x => x.id === this.state.activeProjectId);
        p.tools.find(t => t.id === tid).fields.push({ id: 'f_'+Date.now(), label, type: document.getElementById('nType').value, value: document.getElementById('nVal').value });
        this.saveLocalData(); this.renderAll(); this.closeModal();
      },

      openBulkEnvModal(tid) {
        this.openModal("Bulk Import .env", `
          <div class="space-y-5">
            <textarea id="bulkEnv" rows="8" class="input-field code-input w-full" placeholder="API_KEY=xyz..."></textarea>
            <div class="flex justify-end gap-3">
              <button onclick="window.app.closeModal()" class="btn btn-secondary">Cancel</button>
              <button onclick="window.app.saveBulk('${tid}')" class="btn btn-primary">Import</button>
            </div>
          </div>
        `);
      },
      saveBulk(tid) {
        const text = document.getElementById('bulkEnv').value;
        const p = this.state.data.projects.find(x => x.id === this.state.activeProjectId);
        const t = p.tools.find(x => x.id === tid);
        text.split('\n').forEach(l => {
          if(!l.includes('=')) return;
          const [k, ...v] = l.split('=');
          const isSec = /key|secret|token|pass/i.test(k);
          t.fields.push({ id: 'f_'+Math.random(), label: k.trim(), type: isSec?'secret':'text', value: v.join('=').replace(/^['"]|['"]$/g, '') });
        });
        this.saveLocalData(); this.renderAll(); this.closeModal();
      },

      exportProjectDotEnv() {
        const p = this.state.data.projects.find(x => x.id === this.state.activeProjectId);
        let out = `# Env for ${p.name}\n`;
        p.tools.forEach(t => { out += `\n# --- ${t.name} ---\n`; (t.fields||[]).forEach(f => out += `${f.label}=${f.value}\n`); });
        navigator.clipboard.writeText(out); alert("Copied!");
      },

      openBackupModal() {
        this.openModal("Backup Database", `
          <div class="flex flex-col gap-4">
            <button onclick="window.app.dlBackup()" class="btn btn-primary w-full py-3">⬇ Download Full Backup (.json)</button>
            <label class="btn btn-secondary w-full py-3 text-center cursor-pointer">⬆ Import Backup <input type="file" accept=".json" onchange="window.app.imBackup(event)" class="hidden"></label>
          </div>
        `);
      },
      dlBackup() {
        const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(this.state.data)], {type:'application/json'}));
        a.download = 'stackvault.json'; a.click();
      },
      imBackup(e) {
        const r = new FileReader(); r.onload = (ev) => { this.state.data = JSON.parse(ev.target.result); this.saveLocalData(); this.renderAll(); this.closeModal(); };
        r.readAsText(e.target.files[0]);
      },

      openModal(title, html) { document.getElementById('modalTitle').innerText = title; document.getElementById('modalBody').innerHTML = html; document.getElementById('modalOverlay').classList.replace('hidden', 'flex'); },
      closeModal() { document.getElementById('modalOverlay').classList.replace('flex', 'hidden'); }
    };
    document.addEventListener('DOMContentLoaded', () => window.app.init());
  </script>
</body>
</html>
