          <button class="link-btn gate-alt" data-act="gate-setup">Restore or start a different vault…</button>`;
      } else {
        const notice = pending
          ? `Backup loaded with ${plural(pending.projects.length, 'project')}. Choose a master password to encrypt it.`
          : legacy ? `Found an unencrypted vault from the previous version (${plural((legacy.projects || []).length, 'project')}). Set a master password to encrypt it — the plain-text copy is deleted afterwards.` : '';
        html += `<h1>${hasVault ? 'Restore a vault' : 'Set up your vault'}</h1>
          <p class="gate-sub">Keys are encrypted in your browser with a master password before they are saved or synced — not even Google can read them.</p>
          ${notice ? `<div class="notice">${ic('shield')}<span>${esc(notice)}</span></div>` : ''}
          <div id="gateMsg" class="gate-msg" hidden></div>
          <div class="gate-options">
            <button class="option" data-act="gate-drive">${ic('cloud')}<span><b>Restore from Google Drive</b><small>Already using StackVault on another PC</small></span>${ic('chevron-right')}</button>
            <button class="option" data-act="import-file" data-mode="gate">${ic('upload')}<span><b>Import a backup file</b><small>Encrypted or old .json export</small></span>${ic('chevron-right')}</button>
          </div>
          <div class="divider">${hasVault ? 'or replace it with a new vault' : 'or create a new vault'}</div>
          <form data-form="create" class="gate-form">
            <input type="text" name="username" value="StackVault" autocomplete="username" hidden>
            <label class="field"><span>Master password</span><input type="password" name="password" autocomplete="new-password" ${hasVault ? '' : 'autofocus'}></label>
            <label class="field"><span>Confirm password</span><input type="password" name="confirm" autocomplete="new-password"></label>
            <label class="check"><input type="checkbox" name="remember"><span>Keep unlocked on this device</span></label>
            <p class="hint">${ic('alert')}<span>At least 8 characters. A forgotten master password cannot be recovered.${hasVault ? ' The locked vault in this browser is kept as an undo copy.' : ''}</span></p>
            <div class="form-error" hidden></div>
            <button class="btn btn-primary btn-lg btn-block" type="submit">${pending || legacy ? 'Encrypt & open vault' : 'Create vault'}</button>
          </form>
          ${hasVault ? `<button class="link-btn gate-alt" data-act="gate-unlock">← Back to unlock</button>` : ''}`;
      }
      html += `<div class="gate-foot">${ic('shield')}<span>Encrypted locally · AES-256-GCM</span></div>`;
      $('#gateCard').innerHTML = html;
      requestAnimationFrame(() => { const f = $('#gateCard [autofocus]'); f && f.focus(); });
    }
    function gateMsg(text, err = false) { const el = $('#gateMsg'); if (!el) return toast(text, err ? 'error' : 'info'); el.textContent = text; el.className = 'gate-msg' + (err ? ' err' : ''); el.hidden = false; }

    async function enterVault(key, kdf, data, remember, { save = false } = {}) {
      S.key = key; S.kdf = kdf; S.data = Model.normalize(data); S.prevKeys = []; S.locked = false;
      S.revealed.clear(); S.revealAll = false; S.filter = ''; S.snaps = null;
      Prefs.set({ remember: !!remember });
      if (remember) await KeyStore.set({ key, salt: kdf.salt, iter: kdf.iter }).catch(() => {});
      else await KeyStore.clear();
      const legacy = lsGet(LS.legacy);
      if (legacy && Array.isArray(legacy.projects)) { S.data = Model.merge(S.data, Model.normalize(legacy)); save = true; }
      if (save) await persist(true);
      if (legacy) { ['sv_database', 'sv_master_key', 'sv_theme'].forEach((k) => localStorage.removeItem(k)); toast('Old unencrypted vault migrated and removed'); }
      const last = Prefs.get().lastProject;
      S.projectId = findProject(last) ? last : (S.data.projects[0] && S.data.projects[0].id) || null;
      S.view = 'project';
      $('#gate').hidden = true; $('#gateCard').innerHTML = ''; $('#shell').hidden = false;
      lastActive = now();
      Sync.state = Prefs.get().driveEnabled ? 'idle' : 'off';
      render();
      Sync.run('unlock');
    }
    async function unlockWithPassword(pw, remember) {
      const env = lsGet(LS.vault);
      if (!pw) throw new Error('Enter your master password');
      const kdf = { salt: env.kdf.salt, iter: env.kdf.iter };
      const key = await Crypto.derive(pw, fromB64(kdf.salt), kdf.iter);
      let data;
      try { data = await Crypto.open(key, env); } catch { throw new Error('Wrong master password'); }
      await enterVault(key, kdf, data, remember);
    }
    async function lock() {
      if (S.locked) return;
      if (Sync.meta().dirty && Auth.valid()) await Promise.race([Sync.run('lock'), sleep(4000)]).catch(() => {});
      await flushSaves();
      await KeyStore.clear();
      S.key = null; S.kdf = null; S.data = null; S.prevKeys = []; S.revealed.clear();
      showGate('unlock');
    }

    async function gateRestoreDrive() {
      try {
        const tokenP = Auth.request(); // inside the click: may open Google's pop-up
        await tokenP;
        gateMsg('Looking for your vault in Google Drive…');
        const { user } = await Drive.about();
        rememberDriveUser(user);
        const file = (await Drive.list(`name='${VAULT_FILE}'`))[0];
        if (!file) { gateMsg(`No StackVault vault found in ${user.emailAddress}'s Drive. Create a new vault below — it will sync there automatically.`); return; }
        const env = await Drive.download(file.id);
        const r = await decryptEnv(env, { title: 'Unlock your Drive vault', remember: true, text: `Found a vault last saved ${esc(timeAgo(env.at || Date.parse(file.modifiedTime)))}${env.devName ? ` from ${esc(env.devName)}` : ''}. Enter its master password.` });
        if (Crypto.isEnvelope(lsGet(LS.vault))) backupPrev();
        lsSet(LS.vault, env);
        Sync.setMeta({ fileId: file.id, version: String(file.version), dirty: false, lastSync: now() });
        await enterVault(r.key, r.kdf, r.data, r.remember);
        toast('Vault restored from Google Drive');
      } catch (e) { if (!e.cancelled) gateMsg(e.message, true); }
    }
    async function gateImport(text) {
      let obj;
      try { obj = JSON.parse(text); } catch { return gateMsg('That file is not a StackVault backup (invalid JSON).', true); }
      if (Crypto.isEnvelope(obj)) {
        try {
          const r = await decryptEnv(obj, { title: 'Unlock backup', remember: true, text: 'Enter the master password this backup was created with.' });
          if (Crypto.isEnvelope(lsGet(LS.vault))) backupPrev();
          lsSet(LS.vault, obj);
          if (Prefs.get().driveEnabled) Sync.setMeta({ dirty: true });
          await enterVault(r.key, r.kdf, r.data, r.remember, { save: true });
          toast('Backup restored');
        } catch (e) { if (!e.cancelled) gateMsg(e.message, true); }
      } else if (obj && Array.isArray(obj.projects)) {
        S.pendingImport = Model.normalize(obj);
        showGate('setup');
      } else gateMsg('That file is not a StackVault backup.', true);
    }

    /* ═════════════════ Drive account actions ═════════════════ */
    function rememberDriveUser(user) {
      const p = Prefs.get();
      if (p.driveEmail && p.driveEmail !== user.emailAddress) lsSet(LS.sync, { dirty: true, seq: (Sync.meta().seq || 0) + 1 });
      Prefs.set({ driveEnabled: true, driveEmail: user.emailAddress, driveName: user.displayName || '', drivePhoto: user.photoLink || '' });
    }
    function connectDrive() {
      Auth.request().then(async () => {
        const { user } = await Drive.about();
        rememberDriveUser(user);
        Sync.state = 'idle';
        render();
        toast(`Connected to ${user.emailAddress}`);
        await Sync.run('connect', { interactive: true });
        S.snaps = null; if (S.view === 'backup') render(); else renderRail();
      }).catch((e) => { if (!e.cancelled) toast(e.message, 'error'); });
    }
    function syncNow() {
      if (!Prefs.get().driveEnabled) return connectDrive();
      const go = () => Sync.run('manual', { interactive: true }).then(() => { if (Sync.state === 'idle') toast('Synced with Google Drive'); S.snaps = null; if (S.view === 'backup') loadSnapshots(true); });
      if (Auth.valid()) return go();
      Auth.request().then(go).catch((e) => { if (!e.cancelled) toast(e.message, 'error'); });
    }

    async function importIntoVault(text) {
      let obj;
      try { obj = JSON.parse(text); } catch { return toast('That file is not valid JSON', 'error'); }
      let r;
      try { r = await decryptEnv(obj, { title: 'Unlock backup', text: 'This backup was encrypted with a different master password. Enter it to import.' }); }
      catch (e) { if (!e.cancelled) toast(e.message, 'error'); return; }
      const inc = r.data, c = Model.counts(inc);
      const mode = await Modal.open({
        title: 'Import backup', submit: 'Import',
        body: `<p class="modal-text">This backup contains <b>${plural(c.projects, 'project')}</b>, <b>${plural(c.tools, 'tool')}</b> and <b>${plural(c.keys, 'key')}</b>.</p>
          <div class="choice">
            <label><input type="radio" name="mode" value="merge" checked><span><b>Merge</b><small>Add what's missing; the most recently edited version of each item wins.</small></span></label>
            <label><input type="radio" name="mode" value="replace"><span><b>Replace</b><small>Make the vault exactly match the backup — on every synced PC.</small></span></label>
          </div>`,
        onSubmit: (fd) => fd.mode,
      });
      if (!mode) return;
      backupPrev();
      if (mode === 'replace') { const ts = tick(); S.data = Model.stampAll({ ...inc, resetAt: ts, tombstones: {} }, ts); }
      else S.data = Model.merge(S.data, { ...inc, resetAt: S.data.resetAt, tombstones: {} });
      if (!findProject(S.projectId)) S.projectId = (S.data.projects[0] || {}).id || null;
      await persist(); render();
      toast(mode === 'replace' ? 'Vault replaced from backup' : 'Backup merged', 'ok', { action: 'Undo', onAction: undoRestore });
    }
    async function undoRestore() {
      const prev = lsGet(LS.prev);
      if (!prev) return toast('Nothing to undo', 'info');
      try {
        const r = await decryptEnv(prev.env, { title: 'Unlock previous vault', text: 'The previous version used a different master password.' });
        backupPrev();
        const ts = tick();
        S.data = Model.stampAll({ ...r.data, resetAt: ts, tombstones: {} }, ts);
        if (!findProject(S.projectId)) S.projectId = (S.data.projects[0] || {}).id || null;
        await persist(); render(); toast('Previous version restored');
      } catch (e) { if (!e.cancelled) toast(e.message, 'error'); }
    }

    /* ═════════════════ Modals: project / tool / key ═════════════════ */
    function projectModal(p) {
      Modal.open({
        title: p ? 'Edit project' : 'New project', size: 'sm', submit: p ? 'Save' : 'Create project',
        body: `<label class="field"><span>Name</span><input name="name" value="${esc(p ? p.name : '')}" placeholder="e.g. Snappy App" maxlength="80" autofocus></label>
          <label class="field"><span>Description <em>optional</em></span><input name="description" value="${esc(p ? p.description : '')}" placeholder="What is this project?" maxlength="200"></label>`,
        onSubmit: (fd) => {
          const name = fd.name.trim();
          if (!name) throw new Error('Give the project a name');
          if (p) { Object.assign(p, { name, description: fd.description.trim() }); touch(p); }
          else {
            const ts = tick();
            const np = { id: uid('p'), name, description: fd.description.trim(), createdAt: ts, updatedAt: ts, tools: [] };

    function defaultAccountId() {
      if (!S.data.accounts.length) return '__new';
      const p = curProject(), freq = {};
      if (p) p.tools.forEach((t) => { if (findAccount(t.accountId)) freq[t.accountId] = (freq[t.accountId] || 0) + 1; });
      return Object.entries(freq).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
    }
    const providerOptions = () => [...new Set([...ACCOUNT_PROVIDERS.map(([n]) => n), ...CATALOG.map((x) => x.name)])].map((n) => `<option value="${esc(n)}">`).join('');
    /* Create (or reuse, if the same login + provider already exists) a shared account. */
    function createAccount({ name = '', email = '', provider = '', url, notes = '', withDefaults = true }) {
      const ex = S.data.accounts.find((a) => email && a.email.toLowerCase() === email.toLowerCase() && a.provider.toLowerCase() === provider.toLowerCase());
      if (ex) return ex;
      const ts = tick();
      const a = {
        id: uid('a'), name, email, provider, url: url ?? providerUrl(provider), notes, createdAt: ts, updatedAt: ts,
        fields: withDefaults ? ACCOUNT_DEFAULT_FIELDS.map((f) => ({ id: uid('f'), ...f, value: '', createdAt: tick(), updatedAt: ts })) : [],
      };
      S.data.accounts.push(a);

    /* ── Tool modal: catalog picker (new tools) → details form with account link + default keys ── */
    const presetBtn = (x) => `<button type="button" class="preset" data-act="pick-preset" data-name="${esc(x.name)}"><span class="tool-avatar sm" style="--hue:${hue(x.name)}">${esc(initial(x.name))}</span><span><b>${esc(x.name)}</b><small>${esc(x.cat)} · ${plural(x.keys.length, 'key')}</small></span></button>`;
    function presetListHtml(q, cat) {
      const res = searchCatalog(q, cat);
      const custom = `<button type="button" class="preset custom" data-act="pick-preset" data-name="">${ic('plus')}<span><b>${q ? `Custom: “${esc(q)}”` : 'Custom tool'}</b><small>Start from a blank tool</small></span></button>`;

      if (q) return `<div class="preset-grid">${res.slice(0, 80).map(presetBtn).join('')}${custom}</div>`;

              <label class="field"><span>Project / resource ID</span><input name="resourceId" class="mono" value="${esc(t ? t.resourceId : '')}" placeholder="my-app-prod" spellcheck="false"></label>

          if (accountId === '__new') {
            const email = (fd.newEmail || '').trim();

          const picks = [...form.querySelectorAll('input[name=pk]:checked')].map((c) => ({ label: c.value, type: c.dataset.type === 'text' ? 'text' : 'secret' }));

          const target = t || { id: uid('t'), createdAt: tick(), fields: [] };
          Object.assign(target, vals); touch(target);
          for (const k of picks) if (!target.fields.some((f) => f.label === k.label)) { const ts = tick(); target.fields.push({ id: uid('f'), ...k, value: '', createdAt: ts, updatedAt: ts }); }
          if (!t) curProject().tools.push(target);

          if (!t) requestAnimationFrame(() => flashEl('tool-' + target.id));

    function applyPreset(x, customName) {

    function accountModal(a) {
      Modal.open({
        title: a ? `Edit ${acctTitle(a)}` : 'New account', submit: a ? 'Save' : 'Add account',
        body: `<div class="form-grid">
            <label class="field"><span>Provider</span><input name="provider" list="dlProviders" value="${esc(a ? a.provider : '')}" placeholder="Google, GitHub, Apple ID…" autocomplete="off" data-change="provider-pick" autofocus></label>
            <label class="field"><span>Label <em>optional</em></span><input name="name" value="${esc(a ? a.name : '')}" placeholder="Personal, Work, Client X…" maxlength="60"></label>
            <label class="field span-2"><span>Login email / username</span><input name="email" value="${esc(a ? a.email : '')}" placeholder="you@example.com" autocomplete="off" spellcheck="false"></label>
            <label class="field span-2"><span>Account page URL <em>optional</em></span><input name="url" value="${esc(a ? a.url : '')}" placeholder="https://myaccount.google.com" spellcheck="false"></label>
            <label class="field span-2"><span>Notes <em>optional</em></span><textarea name="notes" rows="2" placeholder="2FA device, recovery email, billing card…">${esc(a ? a.notes : '')}</textarea></label>
            ${a ? '' : `<label class="check span-2"><input type="checkbox" name="defaults" checked><span>Add empty <b>Password</b> and <b>Recovery codes</b> fields</span></label>`}
          </div>
          <datalist id="dlProviders">${providerOptions()}</datalist>`,
        onSubmit: (fd) => {
          const email = fd.email.trim(), name = fd.name.trim(), provider = fd.provider.trim();
          if (!email && !name) throw new Error('Enter a login email / username or a label');
          const url = fd.url.trim() ? safeUrl(fd.url) : '';
          if (fd.url.trim() && !url) throw new Error('Account page URL must be an http(s) web address');
          const dup = S.data.accounts.find((x) => x !== a && email && x.email.toLowerCase() === email.toLowerCase() && x.provider.toLowerCase() === provider.toLowerCase());
          if (dup) throw new Error(`${email}${provider ? ` (${provider})` : ''} already exists`);
          let target = a;
          if (a) { Object.assign(a, { name, email, provider, url, notes: fd.notes.trim() }); touch(a); }
          else target = createAccount({ name, email, provider, url, notes: fd.notes.trim(), withDefaults: !!fd.defaults });
          persist(); render();
          if (S.view === 'accounts') requestAnimationFrame(() => flashEl('acct-' + target.id));
          else toast(`Account ${acctTitle(target)} saved`);

    function fieldModal(oid, fid) {
      const o = fid ? findField(oid, fid) : findOwner(oid);
      const owner = o.t, f = o.f;
      if (!owner) return;
      const isAcct = o.kind === 'account', type = f ? f.type : 'secret';
      const ownerName = isAcct ? acctTitle(owner) : owner.name;
      Modal.open({
        title: f ? `Edit ${f.label}` : `Add ${isAcct ? 'credential' : 'key'} to ${ownerName}`, submit: f ? 'Save' : isAcct ? 'Add credential' : 'Add key',
        body: `<label class="field"><span>${isAcct ? 'Name' : 'Key name'}</span><input name="label" class="${isAcct ? '' : 'mono'}" value="${esc(f ? f.label : '')}" placeholder="${isAcct ? 'Password, Recovery codes, 2FA secret…' : 'API_KEY'}" spellcheck="false" autocomplete="off" autofocus></label>
          <div class="field"><span>Type</span><div class="seg">
            <label><input type="radio" name="type" value="secret" ${type === 'secret' ? 'checked' : ''}><span>${ic('key')}Secret</span></label>
            <label><input type="radio" name="type" value="text" ${type === 'text' ? 'checked' : ''}><span>Plain text</span></label>
          </div></div>
          <label class="field"><span>Value</span><textarea name="value" class="mono" rows="3" spellcheck="false" autocomplete="off" placeholder="Paste the value">${esc(f ? f.value : '')}</textarea></label>`,
        onSubmit: (fd) => {
          const label = isAcct ? fd.label.trim() : fd.label.trim().replace(/\s+/g, '_');
          if (!label) throw new Error('A name is required');
          if (owner.fields.some((x) => x.label === label && x !== f)) throw new Error(`${label} already exists in ${ownerName}`);
          const value = fd.value.replace(/\r\n/g, '\n');
          if (f) { if (f.label !== label || f.type !== fd.type || f.value !== value) { Object.assign(f, { label, type: fd.type, value }); touch(f); } }
          else { const ts = tick(); owner.fields.push({ id: uid('f'), label, type: fd.type || guessType(label), value, createdAt: ts, updatedAt: ts }); }
          persist(); render();
        },
      });
    }
    function bulkModal(oid) {
      const { t } = findOwner(oid);
      if (!t) return;
      Modal.open({
        title: `Paste .env into ${t.name || acctTitle(t)}`, submit: 'Import keys',
        body: `<p class="modal-text">Paste <code>KEY=value</code> lines. Comments and <code>export</code> are ignored; keys that already exist are updated.</p>
          <label class="field"><textarea name="env" rows="9" class="mono" spellcheck="false" placeholder="DATABASE_URL=postgres://…&#10;STRIPE_SECRET_KEY=sk_live_…" autofocus></textarea></label>`,
        onSubmit: (fd) => {
          const rows = parseEnv(fd.env);
          if (!rows.length) throw new Error('No KEY=value lines found');
          let added = 0, updated = 0;
          for (const { key, val } of rows) {
            const ex = t.fields.find((f) => f.label === key);
            if (ex) { if (ex.value !== val) { ex.value = val; touch(ex); updated++; } }
            else { const ts = tick(); t.fields.push({ id: uid('f'), label: key, type: guessType(key), value: val, createdAt: ts, updatedAt: ts }); added++; }
          }
          persist(); render();
          toast(`${plural(added, 'key')} added${updated ? `, ${updated} updated` : ''}`);
        },
      });
    }
    function changePasswordModal() {
      Modal.open({
        title: 'Change master password', size: 'sm', submit: 'Change password',
        body: `<label class="field"><span>Current password</span><input type="password" name="current" autocomplete="current-password" autofocus></label>
          <label class="field"><span>New password</span><input type="password" name="next" autocomplete="new-password"></label>
          <label class="field"><span>Confirm new password</span><input type="password" name="confirm" autocomplete="new-password"></label>
          <p class="hint">${ic('alert')}<span>Old restore points and exported backups keep the old password.</span></p>`,
        onSubmit: async (fd) => {
          const cur = await Crypto.derive(fd.current, fromB64(S.kdf.salt), S.kdf.iter);
          try { await Crypto.open(cur, lsGet(LS.vault)); } catch { throw new Error('Current password is incorrect'); }
          if (fd.next.length < 8) throw new Error('Use at least 8 characters');
          if (fd.next !== fd.confirm) throw new Error('New passwords do not match');
          const kdf = Crypto.newKdf();
          const key = await Crypto.derive(fd.next, fromB64(kdf.salt), kdf.iter);
          S.prevKeys.push({ key: S.key, kdf: S.kdf });
          S.key = key; S.kdf = kdf;
          if (Prefs.get().remember) await KeyStore.set({ key, salt: kdf.salt, iter: kdf.iter });
          await persist();
          toast(Prefs.get().driveEnabled ? 'Password changed — other PCs will ask for it once' : 'Master password changed');
        },
      });
    }

    /* ═════════════════ Navigation ═════════════════ */
    function setView(v) { if (S.view !== v) S.filter = ''; S.view = v; toggleRail(false); render(); $('#content').scrollTop = 0; }
    function openProject(id) {
      S.view = 'project'; S.projectId = id; S.filter = '';

      toggleRail(false); render(); $('#content').scrollTop = 0;
    }
    function flashEl(id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
    }
    function gotoTool(tid, fid) {
      const { p } = findTool(tid);
      if (!p) return;
      S.view = 'project'; S.projectId = p.id; S.filter = ''; S.collapsed.delete(tid);
      Prefs.set({ lastProject: p.id });
      toggleRail(false); render();
      requestAnimationFrame(() => flashEl(fid ? 'kv-' + fid : 'tool-' + tid));
    }
    function gotoAccount(aid, fid) {
      if (!findAccount(aid)) return;
      S.view = 'accounts'; S.filter = ''; S.collapsed.delete(aid);
      toggleRail(false); render();
      requestAnimationFrame(() => flashEl(fid ? 'kv-' + fid : 'acct-' + aid));
    }

    /* ═════════════════ Command palette ═════════════════ */
    const Palette = {
      items: [], shown: [], idx: 0,
      open() {
        if (S.locked) return;
        this.items = this.build();
        $('#palette').hidden = false;
        const i = $('#paletteInput'); i.value = '';
        this.filter('');
        i.focus();
      },
      close() { const el = $('#palette'); if (el) el.hidden = true; },
      build() {
        const it = [], cur = curProject();
        const act = (label, icon, run, sub = '') => it.push({ kind: 'Action', label, sub, icon: ic(icon), run });
        act('New project', 'plus', () => projectModal());
        if (cur) act(`Add tool to ${cur.name}`, 'plus', () => toolModal());
        if (cur) act(`Copy ${cur.name} as .env`, 'copy', () => copyText(envText(cur.name, cur.tools), '.env'));
        act('New account', 'users', () => accountModal());
        act('Overview', 'grid', () => setView('overview'));
        act('Accounts', 'users', () => setView('accounts'));
        act('Backup & sync', 'cloud', () => setView('backup'));
        if (Prefs.get().driveEnabled) act('Sync now', 'refresh', syncNow);
        act('Change theme', 'monitor', Actions.theme);
        act('Lock vault', 'lock', lock);
        for (const p of S.data.projects) {
          it.push({ kind: 'Project', label: p.name, sub: p.description, icon: `<span class="dot" style="--hue:${hue(p.name)}"></span>`, run: () => openProject(p.id) });
          for (const t of p.tools) {
            const a = findAccount(t.accountId);
            it.push({ kind: 'Tool', label: t.name, sub: `${p.name}${a ? ' · ' + acctTitle(a) : ''}`, icon: esc(initial(t.name)), run: () => gotoTool(t.id) });
            for (const f of t.fields) it.push({ kind: 'Key', label: f.label, sub: `${p.name} / ${t.name}`, icon: ic('key'), run: () => gotoTool(t.id, f.id), copy: f.value });
          }
        }
        for (const a of sortedAccounts()) {
          const used = accountUsage(a.id).length;
          it.push({ kind: 'Account', label: acctTitle(a), sub: [a.name && a.email, a.provider, used ? plural(used, 'tool') : ''].filter(Boolean).join(' · '), icon: ic('users'), run: () => gotoAccount(a.id) });
          for (const f of a.fields) it.push({ kind: 'Key', label: f.label, sub: `Account / ${acctTitle(a)}`, icon: ic('key'), run: () => gotoAccount(a.id, f.id), copy: f.value });
        }
        return it;
      },
      filter(q) {
        q = q.trim().toLowerCase();
        if (!q) this.shown = this.items.filter((x) => x.kind !== 'Key').slice(0, 40);
        else {
          this.shown = this.items.map((x) => {
            const l = x.label.toLowerCase(), s = (x.sub || '').toLowerCase();
            const sc = l === q ? 5 : l.startsWith(q) ? 4 : l.includes(q) ? 3 : s.includes(q) ? 1 : 0;
            return [sc + (x.kind === 'Action' ? 0 : 0.5), x];
          }).filter(([s]) => s >= 1).sort((a, b) => b[0] - a[0]).slice(0, 60).map(([, x]) => x);
        }
        this.idx = 0; this.paint();
      },
      paint() {
        const el = $('#paletteList');
        el.innerHTML = this.shown.length ? this.shown.map((x, i) => `<button class="pal-item${i === this.idx ? ' active' : ''}" data-pal="${i}" role="option" aria-selected="${i === this.idx}"><span class="pal-ico">${x.icon}</span><span class="pal-text"><b>${esc(x.label)}</b>${x.sub ? `<small>${esc(x.sub)}</small>` : ''}</span><span class="pal-kind">${x.kind}</span></button>`).join('') : `<p class="pal-empty">No results</p>`;
        const a = el.querySelector('.active'); a && a.scrollIntoView({ block: 'nearest' });
      },
      run(i, copy) {
        const x = this.shown[i];
        if (!x) return;
        this.close();
        if (copy && x.copy != null) copyText(x.copy, x.label); else x.run();
      },
    };

    /* ═════════════════ Actions (event delegation) ═════════════════ */
    const Actions = {
      theme() {
        const order = ['system', 'light', 'dark'];
        const t = order[(order.indexOf(Prefs.get().theme) + 1) % 3];
        Prefs.set({ theme: t }); applyTheme();
        if (S.locked) { const b = $('#gateCard [data-act=theme]'); if (b) { b.innerHTML = ic(t === 'light' ? 'sun' : t === 'dark' ? 'moon' : 'monitor'); b.title = 'Theme: ' + t; } }
        toast(`Theme: ${t[0].toUpperCase() + t.slice(1)}`, 'info', { ms: 1200 });
      },
      palette() { Palette.open(); },
      'open-rail'() { toggleRail(true); },
      'close-rail'() { toggleRail(false); },
      view(el) { setView(el.dataset.view); },
      'open-project'(el) { openProject(el.dataset.id); },
      'new-project'() { projectModal(); },
      'edit-project'() { const p = curProject(); if (p) projectModal(p); },
      async 'delete-project'() {
        const p = curProject(); if (!p) return;
        const keys = p.tools.reduce((n, t) => n + t.fields.length, 0);
        if (!(await confirmBox(`Delete ${p.name}?`, `This removes <b>${plural(p.tools.length, 'tool')}</b> and <b>${plural(keys, 'key')}</b> from every synced PC. You can still get it back from a restore point or backup.`, { submit: 'Delete project', danger: true }))) return;
        S.data.projects = S.data.projects.filter((x) => x !== p);
        S.data.tombstones[p.id] = tick();
        S.projectId = (S.data.projects[0] || {}).id || null;
        persist(); render(); toast(`Deleted ${p.name}`, 'info');
      },
      'add-tool'() { if (!curProject()) return projectModal(); toolModal(); },
      'edit-tool'(el) { const { t } = findTool(el.dataset.id); if (t) toolModal(t); },
      async 'delete-tool'(el) {
        const { p, t } = findTool(el.dataset.id); if (!t) return;
        if (!(await confirmBox(`Delete ${t.name}?`, `Its <b>${plural(t.fields.length, 'key')}</b> will be removed from every synced PC.`, { submit: 'Delete tool', danger: true }))) return;
        p.tools = p.tools.filter((x) => x !== t);
        S.data.tombstones[`${p.id}/${t.id}`] = tick();
        persist(); render(); toast(`Deleted ${t.name}`, 'info');
      },
      'toggle-tool'(el) { const id = el.dataset.id; S.collapsed.has(id) ? S.collapsed.delete(id) : S.collapsed.add(id); rerenderStack(); },
      'reveal-all'() { S.revealAll = !S.revealAll; S.revealed.clear(); render(); },
      'toggle-reveal'(el) { const id = el.dataset.id; S.revealed.has(id) ? S.revealed.delete(id) : S.revealed.add(id); rerenderStack(); },
      'copy-field'(el) { const { f } = findField(el.dataset.owner, el.dataset.id); if (f) copyText(f.value, f.label); },
      'delete-field'(el) {
        const { t, f, path } = findField(el.dataset.owner, el.dataset.id); if (!f) return;
        const idx = t.fields.indexOf(f);
        t.fields.splice(idx, 1);
        S.data.tombstones[path] = tick();
        persist(); rerenderStack();
        toast(`Deleted ${f.label}`, 'info', {
          action: 'Undo',
          onAction: () => {
            const cur = findOwner(t.id).t; if (!cur) return;
            delete S.data.tombstones[path];
            f.updatedAt = tick();
            cur.fields.splice(Math.min(idx, cur.fields.length), 0, f);
            persist(); render();
          },
        });
      },
      'add-field'(el) { fieldModal(el.dataset.owner); },
      'edit-field'(el) { fieldModal(el.dataset.owner, el.dataset.id); },
      'bulk-env'(el) { bulkModal(el.dataset.owner); },
      'new-account'() { accountModal(); },
      'edit-account'(el) { const a = findAccount(el.dataset.id); if (a) accountModal(a); },
      'goto-account'(el) { gotoAccount(el.dataset.id); },
      async 'delete-account'(el) {
        const a = findAccount(el.dataset.id); if (!a) return;
        const used = accountUsage(a.id);
        if (!(await confirmBox(`Delete ${acctTitle(a)}?`, `${a.fields.length ? `Its <b>${plural(a.fields.length, 'saved credential')}</b> will be removed from every synced PC. ` : ''}${used.length ? `<b>${plural(used.length, 'tool')}</b> will be left without an account.` : 'No tools use it.'}`, { submit: 'Delete account', danger: true }))) return;
        S.data.accounts = S.data.accounts.filter((x) => x !== a);
        S.data.tombstones['@' + a.id] = tick();
        for (const { t } of used) { t.accountId = ''; touch(t); }
        persist(); render(); toast(`Deleted ${acctTitle(a)}`, 'info');
      },
      'pick-preset'(el) {
        const q = ($('#modalForm [data-input=preset-search]') || {}).value || '';
        applyPreset(presetByName(el.dataset.name), q.trim());
      },
      'preset-back'() {
        $('#formStep').hidden = true; $('#pickStep').hidden = false;
        const i = $('#modalForm [data-input=preset-search]'); if (i) { i.focus(); i.select(); }
      },
      'preset-cat'(el) {
        document.querySelectorAll('#modalForm .cat-chip').forEach((c) => c.classList.toggle('active', c === el));
        const list = $('#presetList'); list.dataset.cat = el.dataset.cat;
        list.innerHTML = presetListHtml($('#modalForm [data-input=preset-search]').value, el.dataset.cat);
        list.scrollTop = 0;
      },
      'copy-tool-env'(el) { const { t } = findTool(el.dataset.id); if (t) copyText(envText(t.name, [t]), `${t.name} .env`); },
      'copy-project-env'() { const p = curProject(); if (p) copyText(envText(p.name, p.tools), `${p.name} .env`); },
      'download-project-env'() { const p = curProject(); if (p) downloadFile(`${slug(p.name)}.env`, envText(p.name, p.tools), 'text/plain'); },
      'goto-tool'(el) { gotoTool(el.dataset.id); },
      'copy-account'(el) { copyText(el.dataset.value, 'Account'); },
      'sync-chip'() {
        if (!Prefs.get().driveEnabled) return setView('backup');
        syncNow();
      },
      'connect-drive'() { connectDrive(); },
      async 'disconnect-drive'() {
        if (!(await confirmBox('Disconnect Google Drive?', 'This PC stops syncing. Your vault stays here and in Drive; reconnect any time.', { submit: 'Disconnect' }))) return;
        Auth.clear(true);
        Prefs.set({ driveEnabled: false });
        lsSet(LS.sync, { dirty: !!Sync.meta().dirty, seq: Sync.meta().seq || 0 });
        Sync.needsPassword = false; Sync.set('off'); S.snaps = null;
        render();
      },
      'sync-now'() { syncNow(); },
      async 'snapshot-now'() {
        if (!Auth.valid()) return syncNow();
        try { await flushSaves(); await Drive.create(`${SNAP_PREFIX}${stampName()}-manual.json`, lsGet(LS.vault)); toast('Restore point created'); loadSnapshots(true); }
        catch (e) { toast(e.message, 'error'); }
      },
      async 'force-push'() {
        if (!(await confirmBox('Replace the Drive copy?', 'The vault in Google Drive (protected by a password you could not enter) will be overwritten by this one. A copy of it is saved as a restore point first.', { submit: 'Replace Drive copy', danger: true }))) return;
        Sync.forcePush();
      },
      async 'restore-snap'(el) {
        const id = el.dataset.id;
        if (!(await confirmBox('Restore this point?', `Your vault will be replaced with the version from <b>${esc(el.dataset.when)}</b> on every synced PC. The current state is saved as a new restore point first.`, { submit: 'Restore', danger: true }))) return;
        try {
          const env = await Drive.download(id);
          const r = await decryptEnv(env, { title: 'Unlock restore point', text: 'This restore point was saved with a different master password. Enter it to restore.' });
          await flushSaves();
          await Drive.create(`${SNAP_PREFIX}${stampName()}-before-restore.json`, lsGet(LS.vault));
          backupPrev();
          const ts = tick();
          S.data = Model.stampAll({ ...r.data, resetAt: ts, tombstones: {} }, ts);
          if (!findProject(S.projectId)) S.projectId = (S.data.projects[0] || {}).id || null;
          S.snaps = null;
          await persist(); render();
          toast('Vault restored');
          Sync.run('restore');
        } catch (e) { if (!e.cancelled) toast(e.message, 'error'); }
      },
      async 'export-encrypted'() {
        await flushSaves();
        downloadFile(`stackvault-${today()}.encrypted.json`, JSON.stringify(lsGet(LS.vault)));
        toast('Encrypted backup downloaded');
      },
      async 'export-plain'() {
        if (!(await confirmBox('Export without encryption?', 'Anyone who gets this file can read <b>every key</b>. Prefer the encrypted export unless you really need plain text.', { submit: 'Export plain JSON', danger: true }))) return;
        downloadFile(`stackvault-${today()}-UNENCRYPTED.json`, JSON.stringify(S.data, null, 2));
      },
      'import-file'(el) { const fi = $('#fileInput'); fi.dataset.mode = el.dataset.mode || 'vault'; fi.value = ''; fi.click(); },
      'undo-restore'() { undoRestore(); },
      'change-password'() { changePasswordModal(); },
      lock() { lock(); },
      'modal-close'() { Modal.close(); },
      'gate-drive'() { gateRestoreDrive(); },
      'gate-setup'() { showGate('setup'); },
      'gate-unlock'() { S.pendingImport = null; showGate('unlock'); },
    };
    const Changes = {
      'field-value'(el) {
        const { f } = findField(el.dataset.owner, el.dataset.id);
        if (!f || f.value === el.value) return;
        f.value = el.value; touch(f); persist();
        const row = el.closest('.kv');
        if (row) { row.classList.add('saved'); setTimeout(() => row.classList.remove('saved'), 1100); }
      },
      async remember(el) {
        if (el.checked) { await KeyStore.set({ key: S.key, salt: S.kdf.salt, iter: S.kdf.iter }); Prefs.set({ remember: true }); toast('This device will stay unlocked'); }
        else { await KeyStore.clear(); Prefs.set({ remember: false }); toast('Password required next time'); }
        render();
      },
      autolock(el) { Prefs.set({ autoLockMin: Number(el.value) }); toast(Number(el.value) ? `Auto-lock after ${el.selectedOptions[0].text}` : 'Auto-lock off'); },
      'acct-select'(el) {
        const box = el.form && el.form.querySelector('.new-acct');
        if (!box) return;
        box.hidden = el.value !== '__new';
        if (!box.hidden) { const e = el.form.elements.newEmail; if (!e.value) e.value = Prefs.get().driveEmail || ''; e.focus(); e.select(); }
      },
      'provider-pick'(el) {
        const url = el.form && el.form.elements.url;
        if (url && !url.value.trim()) url.value = providerUrl(el.value);
      },
    };

    /* ═════════════════ Wiring ═════════════════ */
    let lastActive = now();
    function wire() {
      document.addEventListener('click', (e) => {
        const pal = e.target.closest('[data-pal]');
        if (pal) return Palette.run(Number(pal.dataset.pal), e.shiftKey);
        if (e.target.id === 'palette') return Palette.close();
        if (e.target.id === 'modal') return Modal.close();
        const el = e.target.closest('[data-act]');
        if (!el || el.disabled) return;
        const fn = Actions[el.dataset.act];
        if (fn) fn(el, e);
      });
      document.addEventListener('change', (e) => {
        const el = e.target.closest('[data-change]');
        if (el && Changes[el.dataset.change]) Changes[el.dataset.change](el, e);
      });
      document.addEventListener('input', (e) => {
        if (e.target.dataset.input === 'filter') { S.filter = e.target.value; rerenderStack(); }
        if (e.target.dataset.input === 'preset-search') { const l = $('#presetList'); if (l) { l.innerHTML = presetListHtml(e.target.value, l.dataset.cat || 'All'); l.scrollTop = 0; } }
        if (e.target.id === 'paletteInput') Palette.filter(e.target.value);
      });
      document.addEventListener('submit', async (e) => {
        const form = e.target;
        if (form.id === 'modalForm') return Modal.submit(e);
        const kind = form.dataset.form;
        if (!kind) return;
        e.preventDefault();
        if (form.dataset.busy) return; // one unlock/create at a time
        form.dataset.busy = '1';
        const fd = Object.fromEntries(new FormData(form));
        const err = form.querySelector('.form-error'), btn = form.querySelector('[type=submit]'), label = btn.innerHTML;
        const fail = (m) => { err.textContent = m; err.hidden = false; btn.disabled = false; btn.innerHTML = label; delete form.dataset.busy; };
        err.hidden = true;
        if (kind === 'unlock') {
          // Reconnect Google inside this click so the token pop-up isn't blocked.
          if (Prefs.get().driveEnabled && !Auth.valid() && Auth.ready()) Auth.request().then(() => Sync.run('auth', { interactive: true })).catch(() => {});
          btn.disabled = true; btn.innerHTML = `${ic('refresh', 'spin')} Unlocking…`;
          try { await unlockWithPassword(fd.password, !!fd.remember); } catch (x) { fail(x.message); form.password.select(); }
        } else if (kind === 'create') {
          if ((fd.password || '').length < 8) return fail('Use at least 8 characters.');
          if (fd.password !== fd.confirm) return fail('Passwords do not match.');
          btn.disabled = true; btn.innerHTML = `${ic('refresh', 'spin')} Encrypting…`;
          try {
            const kdf = Crypto.newKdf();
            const key = await Crypto.derive(fd.password, fromB64(kdf.salt), kdf.iter);
            const data = S.pendingImport || Model.empty();
            if (Crypto.isEnvelope(lsGet(LS.vault))) backupPrev();
            if (Prefs.get().driveEnabled) Sync.setMeta({ version: null });
            S.pendingImport = null;
            await enterVault(key, kdf, data, !!fd.remember, { save: true });
            toast('Vault created and encrypted');
          } catch (x) { fail(x.message); }
        }
      });
      document.addEventListener('keydown', (e) => {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
          e.preventDefault();
          if (!S.locked) $('#palette').hidden ? Palette.open() : Palette.close();
          return;
        }
        if (!$('#palette').hidden && e.target.id === 'paletteInput') {
          if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); const n = Palette.shown.length; if (n) { Palette.idx = (Palette.idx + (e.key === 'ArrowDown' ? 1 : -1) + n) % n; Palette.paint(); } }
          else if (e.key === 'Enter') { e.preventDefault(); Palette.run(Palette.idx, e.shiftKey); }
          else if (e.key === 'Escape') Palette.close();
          return;
        }
        if (e.key === 'Enter' && e.target.dataset && e.target.dataset.input === 'preset-search') {
          e.preventDefault();
          const first = $('#presetList .preset'); if (first) first.click();
          return;
        }
        if (e.key === 'Escape') {
          if (Modal.isOpen()) return Modal.close();
          if ($('#shell').classList.contains('rail-open')) return toggleRail(false);
        }
        if (e.key === 'Enter' && e.target.matches && e.target.matches('.kv-val input:not([readonly])')) e.target.blur();
        if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('tr[data-act], input[readonly][data-act]')) { e.preventDefault(); e.target.click(); }
      });
      document.addEventListener('focusout', () => setTimeout(() => {
        if (!S.pendingRender || S.locked || Modal.isOpen()) return;
        const a = document.activeElement;
        if (a && $('#content').contains(a) && a.matches('input, textarea, select')) return;
        render();
      }, 0));
      $('#fileInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 10e6) return toast('That file is too large to be a StackVault backup', 'error');
        const text = await file.text();
        if (e.target.dataset.mode === 'gate' || S.locked) gateImport(text); else importIntoVault(text);
      });

      // Another tab saved → merge it in.
      window.addEventListener('storage', async (e) => {
        if (e.key !== LS.vault || S.locked || !e.newValue) return;
        try {
          const env = JSON.parse(e.newValue);
          if (!Crypto.isEnvelope(env) || env.kdf.salt !== S.kdf.salt) return;
          const merged = Model.merge(S.data, Model.normalize(await Crypto.open(S.key, env)));
          if (canon(merged) !== canon(S.data)) { S.data = merged; softRender(); }
        } catch {}
      });

      // Activity + auto-lock
      ['pointerdown', 'keydown', 'wheel', 'touchstart'].forEach((ev) => addEventListener(ev, () => { lastActive = now(); }, { passive: true }));
      setInterval(() => {
        if (S.locked) return;
        Sync.paint();
        const p = Prefs.get();
        if (!p.remember && Number(p.autoLockMin) > 0 && now() - lastActive > p.autoLockMin * 60e3) { lock(); toast('Locked after inactivity', 'info'); }
      }, 20e3);

      // Sync triggers
      setInterval(() => { if (!S.locked && document.visibilityState === 'visible') Sync.run('poll'); }, POLL_MS);
      document.addEventListener('visibilitychange', () => Sync.run(document.visibilityState === 'visible' ? 'focus' : 'hidden'));
      addEventListener('online', () => Sync.run('online'));
      addEventListener('offline', () => { if (Sync.enabled()) Sync.set('offline'); });
      addEventListener('pagehide', () => Sync.flush());
    }

    /* ═════════════════ Boot ═════════════════ */
    async function boot() {
      document.querySelectorAll('.mod-k').forEach((k) => { k.textContent = `${MOD} K`; });
      applyTheme();
      Auth.load();
      wire();
      if (!window.isSecureContext || !crypto.subtle) {
        document.body.innerHTML = '<p style="padding:40px;font:15px system-ui">StackVault needs a secure (https) page to use encryption.</p>';
        return;
      }
      const env = lsGet(LS.vault);
      if (Crypto.isEnvelope(env)) {
        const rec = await KeyStore.get();
        if (rec && rec.salt === env.kdf.salt) {
          try { return await enterVault(rec.key, { salt: rec.salt, iter: rec.iter }, await Crypto.open(rec.key, env), true); } catch {}
        }
        return showGate('unlock');
      }
      showGate('setup');
    }

    if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) window.__sv = { Model, Crypto, S, Sync, Drive, Auth, decryptEnv, canon };
    boot();
  })();
  </script>
</body>
</html>
